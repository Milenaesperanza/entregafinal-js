<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudoro - tu estudio en foco</title>
    <link rel="icon" type="image/png" href="assets/estudoro-applogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overlock:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <img src="assets/estudoro-applogo.png" alt="Logo de Estudoro: tomate con cara de reloj leyendo un libro.">
        <div class="encabezado_contenido">
            <h1>Estudoro</h1>
            <p>tu estudio, en foco</p>
        </div>
    </header>
    <main class="tablero">
      <nav class="pestanias">
         <button class="pestania-activa" id="btn-pomodoro" type="button">Pomodoro</button>
         <button id="btn-lista" type="button">Lista</button>
      </nav>
        <section class="vista_pomodoro">
            <h2>Pomodoro</h2>
            <p class="foco_actividad" id="foco-actividad">Elegí una materia para empezar</p>
            <div class="reloj">
                <img class="reloj_imagen" src="/assets/reloj-dibujo.png" alt="marco de reloj cronometro con estilo de dibujo">
                <div class="reloj_centro">
                  <p class="reloj_fase" id="reloj-fase">Enfoque</p>
                  <p class="reloj_tiempo" id="reloj-tiempo">25:00</p>
                  <p class="reloj_estado" id="reloj-estado">En pausa</p>
                </div>
            </div>
        </section>
        <section class="vista_lista">
            <h2>Mis materias del día</h2>
            <div class="barra sugerencias">
                <p>Sugeridas:</p>
                <ul class="sugerencias_lista">
                    <li class="sugerencia">
                        <button class="boton" id="btn-otra">Otra</button>
                    </li>
                </ul>
            </div>
            <ul class="lista" id="lista-materias">
            </ul>
        </section>
    </main>
    <div class="modal" id="modal-materia">
        <form class="modal_caja formulario" id="formulario-materia">
            <button class="modal_cerrar" type="button" id="btn-cerrarmodal">X</button>
            <h3>Nueva materia</h3>

            <label>
                <span>¿Qué materia querés estudiar?</span>
                <input type="text" id="campo-titulo" maxlength="20" placeholder="Literatura" required>
            </label>
            <label>
                <span>¿Cuánto tiempo querés estudiar?</span>
                <select id="campo-bloques" required>
                    <option value="1">1 bloque: 30 minutos</option>
                    <option value="2">2 bloques: 1 hora</option>
                    <option value="3">3 bloques: 1 hora 30 minutos</option>
                    <option value="4">4 bloques: 2 horas</option>
                </select>
                <p>Cada bloque contiene su descanso</p>
            </label>

            <button class="boton boton_principal formulario_guardar" type="submit">Guardar</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2026 Estudoro - Una app para el curso de Javascript de Coderhouse</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
