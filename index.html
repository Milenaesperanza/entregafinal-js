<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudoro - tu estudio en foco</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <img src="assets/estudoro-applogo.png" alt="Logo de Estudoro: tomate con cara de reloj leyendo un libro.">
        <div class="encabezado_contenido">
            <h1>Estudoro</h1>
            <p>tu estudio, en foco</p>
        </div>
    </header>
    <main class="tablero">
        <section class="vista_pomodoro">
            <h2>Pomodoro</h2>
            <p class="foco_actividad">Elegí una materia para empezar</p>
            <div class="reloj">
                <img class="reloj_imagen" src="/assets/reloj-dibujo.png" alt="marco de reloj cronometro con estilo de dibujo">
                <div class="reloj_centro">
                  <p class="reloj_fase">Enfoque</p>
                  <p class="reloj_tiempo">25:00</p>
                  <p class="reloj_estado">En pausa</p>
                </div>
            </div>
        </section>
        <section class="vista_lista">
            <h2>Mis materias del día</h2>
            <div class="barra sugerencias">
                <p>Sugeridas:</p>
                <ul class="sugerencias_lista">
                    <li class="sugerencia">
                        <button class="boton">Matemática</button>
                    </li>
                    <li class="sugerencia">
                        <button class="boton">Programación</button>
                    </li>
                    <li class="sugerencia">
                        <button class="boton">Inglés</button>
                    </li>
                    <li class="sugerencia">
                        <button class="boton">Otra</button>
                    </li>
                </ul>
            </div>
            <ul class="lista" id="lista-materias">
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Estudoro - Una app para el curso de Javascript de Coderhouse</p>
    </footer>
    
</body>
</html>
